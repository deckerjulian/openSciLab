- type: nmos
  title: N-channel MOSFET
  category: Semiconductors
  prefix: Q
  keywords: mosfet nmos fet n-channel 2N7000 IRLZ44N BS170
  description: An N-channel enhancement MOSFET (pins G, D, S).
  symbol:
    shapes:
      - {circle: [8, 0, 22]}
      - {line: [-10, -14, -10, 14], width: 2}
      - {line: [-4, -16, -4, -8], width: 2}
      - {line: [-4, -4, -4, 4], width: 2}
      - {line: [-4, 8, -4, 16], width: 2}
      - {line: [-4, -12, 20, -12, 20, -20]}
      - {line: [-4, 12, 20, 12, 20, 20]}
      - {line: [-4, 0, 20, 0, 20, 12]}
      - {line: [-4, 0, 4, -4, 4, 4, -4, 0], fill: outline}
    pins:
      - {number: "1", name: G, at: [-30, 0], angle: 0, length: 20}
      - {number: "2", name: D, at: [20, -40], angle: 90, length: 20}
      - {number: "3", name: S, at: [20, 40], angle: 270, length: 20}
    reference: {at: [34, -6], align: left}
    value: {at: [34, 8], align: left}
    pin_names: false
  params:
    - {name: value, label: Model, default: 2N7000, kind: model, description: "The model (2N7000, BS170, IRLZ44N ...)."}
  spice: "{ref:M} {pin.2} {pin.1} {pin.3} {value}"
  current: "@{ref:M}[id]"

