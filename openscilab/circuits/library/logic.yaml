- type: gate.xor
  title: XOR gate
  category: Logic
  prefix: U
  keywords: xor exclusive gate logic digital 7486
  description: Two inputs, high when exactly one is high.
  symbol:
    shapes:
      - {arc: [-26, -20, -18, 0, -26, 20]}
      - {arc: [-20, -20, -12, 0, -20, 20]}
      - {bezier: [-20, -20, 0, -20, 14, -12, 20, 0]}
      - {bezier: [-20, 20, 0, 20, 14, 12, 20, 0]}
    pins:
      - {number: "1", name: A, at: [-40, -10], angle: 0, length: 20, kind: input}
      - {number: "2", name: B, at: [-40, 10], angle: 0, length: 20, kind: input}
