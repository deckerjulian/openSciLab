      - {number: "1", name: A, at: [-40, -10], angle: 0, length: 26, kind: input}
      - {number: "2", name: B, at: [-40, 10], angle: 0, length: 26, kind: input}
      - {number: "3", name: Y, at: [40, 0], angle: 180, length: 20, kind: output}
