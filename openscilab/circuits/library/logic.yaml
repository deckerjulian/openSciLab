# openSciLab's own components: digital gates (XSPICE); their pins meet analog nets through bridges
- type: gate.and
  title: AND gate
  category: Logic
  prefix: U
  keywords: and gate logic digital 7408
  description: Two inputs, high when both are high.
  symbol:
    shapes:
      - {line: [0, -20, -20, -20, -20, 20, 0, 20]}
      - {arc: [0, -20, 20, 0, 0, 20]}
    pins:
      - {number: "1", name: A, at: [-40, -10], angle: 0, length: 20, kind: input}
      - {number: "2", name: B, at: [-40, 10], angle: 0, length: 20, kind: input}
      - {number: "3", name: Y, at: [40, 0], angle: 180, length: 20, kind: output}
    reference: {at: [0, -28]}
    value: false
    pin_names: false
  params: &delay
    - {name: delay, label: Delay, unit: s, default: 10 ns, min: 0, description: The time from an input to the output.}
  show: []
  digital: true
  spice: "{ref:A} [{pin.1} {pin.2}] {pin.3} {ref}_model"
  definitions: [".model {ref}_model d_and(rise_delay={delay} fall_delay={delay})"]

- type: gate.nand
  title: NAND gate
  category: Logic
  prefix: U
  keywords: nand gate logic digital 7400
  description: Two inputs, low when both are high.
  symbol:
    shapes:
      - {line: [0, -20, -20, -20, -20, 20, 0, 20]}
      - {arc: [0, -20, 20, 0, 0, 20]}
      - {circle: [24, 0, 4]}
    pins:
      - {number: "1", name: A, at: [-40, -10], angle: 0, length: 20, kind: input}
      - {number: "2", name: B, at: [-40, 10], angle: 0, length: 20, kind: input}
      - {number: "3", name: Y, at: [40, 0], angle: 180, length: 12, kind: output}
    reference: {at: [0, -28]}
    value: false
    pin_names: false
  params: *delay
  show: []
  digital: true
  spice: "{ref:A} [{pin.1} {pin.2}] {pin.3} {ref}_model"
  definitions: [".model {ref}_model d_nand(rise_delay={delay} fall_delay={delay})"]

