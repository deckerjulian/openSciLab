flow: Button
description: 'The device node tells the simulator when the button is pressed (signals). Live, every block of the stream is counted; at the end the buffer hands the whole recording to the debounce filter and the check.'
nodes:
  uno:
    type: device.device
    signals: {channels: {D2: {type: button, presses: [[0.1, 0.35], [0.6, 0.8]], bounce: 2 ms, bounces: 4}}}
    at: [0, 136]
  stream: {type: device.stream, channels: [D2], rate: 10 kHz, duration: 1 s, at: [288, 136]}
  raw: {type: measure.count, edge: falling, at: [576, 272]}
  raw_view: {type: view.number, title: Edges of the contact, at: [864, 272]}
  recording: {type: data.buffer, length: 2 s, at: [576, 104]}
  debounce: {type: signal.debounce, time: 5 ms, at: [864, 104]}
  presses: {type: measure.count, edge: falling, at: [1152, 104]}
  presses_view: {type: view.number, title: Presses, at: [1440, 208]}
  check: {type: report.check, expected: 2, title: Presses, at: [1440, 0]}
edges:
  - uno.device -> stream.device
  - stream.D2 -> raw.in
  - raw.out -> raw_view.in
  - stream.D2 -> recording.in
  - stream.done -> recording.trigger
  - recording.out -> debounce.in
  - debounce.out -> presses.in
  - presses.out -> presses_view.in
  - presses.out -> check.in
