flow: Monitor
description: 'device.monitor reports D2, D3 and A0 at 20 Hz for 2 s.'
nodes:
  uno: {type: device.device, at: [0, 240]}
  pwm: {type: gpio.pwm, pin: D9, duty: 0.6, frequency: 1 kHz, at: [272, 368]}
  monitor:
    type: device.monitor
    pins: [D2, D3]
    analog: [A0]
    rate: 20 Hz
    duration: 2 s
    at: [272, 104]
  chart: {type: view.chart, title: A0, window: 3 s, at: [544, 328]}
  d3: {type: view.led, title: D3, at: [544, 0]}
  volts: {type: view.number, title: A0, unit: V, at: [544, 152]}
edges:
  - uno.device -> pwm.device
  - uno.device -> monitor.device
  - monitor.A0 -> chart.in
  - monitor.A0 -> volts.in
  - monitor.D3 -> d3.in
