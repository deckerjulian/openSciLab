circuit: Hybrid AC/DC lab power supply
description: 'A lab supply for DC, AC or both, up to 230 V: RV_DC sets the DC voltage, RV_AC the AC voltage (RMS); two switching regulators keep the rails VPOS and VNEG 10 V beyond the peak the output needs, a linear power amplifier (PA94) makes the output exact and clean. Taken off at OUT and COM.'
