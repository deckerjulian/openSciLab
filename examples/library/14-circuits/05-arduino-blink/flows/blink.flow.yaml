  capture: {type: device.capture, channels: [LED], rate: 2 kHz, duration: 2 s, at: [288, 0]}
  edges: {type: measure.count, edge: rising, total: false, at: [576, 0]}
  check: {type: report.check, low: 3, high: 6, title: Blinks in 2 s, at: [864, 0]}
