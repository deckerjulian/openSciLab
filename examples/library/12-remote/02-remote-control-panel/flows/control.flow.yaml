flow: Remote control panel
description: 'The panel binds the slider to heater.value, the switch to fan.value and the button to calibrate.trigger.'
nodes:
  station: {type: device.device, at: [0, 304]}
  temperature: {type: remote.input, channel: temperature, at: [272, 592]}
  humidity: {type: remote.input, channel: humidity, at: [272, 456]}
  heater: {type: remote.output, channel: heater, value: 0, at: [272, 312]}
  fan: {type: gpio.output, pin: fan, level: 0, at: [272, 168]}
  calibrate: {type: remote.command, command: calibrate, args: {reference: 21}, at: [272, 0]}
edges:
