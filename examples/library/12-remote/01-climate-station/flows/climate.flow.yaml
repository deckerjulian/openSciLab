flow: Climate station
description: remote.input hands on every value of an input with its time on the station (converted with the measured clock).
nodes:
  station: {type: device.device, at: [0, 240]}
  temperature: {type: remote.input, channel: temperature, at: [272, 112]}
  humidity: {type: remote.input, channel: humidity, at: [272, 240]}
  door: {type: remote.input, channel: door, at: [272, 376]}
  temperature_chart: {type: view.chart, title: Temperature, window: 60 s, at: [544, 0]}
  humidity_chart: {type: view.chart, title: Humidity, window: 60 s, at: [544, 280]}
  door_open: {type: view.led, title: Door open, at: [544, 448]}
  log: {type: data.logger, path: climate.csv, at: [544, 168]}
edges:
  - station.device -> temperature.device
  - station.device -> humidity.device
  - station.device -> door.device
  - temperature.out -> temperature_chart.in
  - humidity.out -> humidity_chart.in
  - door.out -> door_open.in
  - temperature.out -> log.in
  - humidity.out -> log.in
