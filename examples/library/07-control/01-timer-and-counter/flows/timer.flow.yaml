flow: Timer and counter
description: control.timer -> measure.count -> signal.math; the views show every value.
nodes:
  timer: {type: control.timer, interval: 100 ms, count: 10, at: [0, 208]}
  count: {type: measure.count, at: [288, 208]}
  square: {type: signal.math, expression: a ** 2, at: [576, 0]}
  chart: {type: view.chart, title: Count squared, window: 2 s, at: [864, 0]}
  show: {type: view.number, title: Count, at: [576, 408]}
  check: {type: report.check, low: 1, high: 10, title: Ticks, at: [576, 208]}
edges:
  - timer.tick -> count.in
  - count.out -> square.a
  - count.out -> show.in
  - count.out -> check.in
  - square.out -> chart.in
