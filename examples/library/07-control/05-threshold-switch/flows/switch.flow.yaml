flow: Threshold switch
description: The monitor reads A0 while the RC low pass charges; above 2.5 V the limit's 'ok' turns D13 on.
nodes:
  uno: {type: device.device, at: [0, 184]}
  pwm: {type: gpio.pwm, pin: D9, duty: 0.8, frequency: 1 kHz, at: [288, 344]}
  monitor: {type: device.monitor, analog: [A0], rate: 20 Hz, duration: 1.5 s, at: [288, 136]}
  above: {type: control.range, low: 2.5, at: [576, 72]}
  led: {type: gpio.output, pin: D13, at: [864, 0]}
  shown: {type: view.led, title: A0 above 2.5 V, at: [864, 144]}
  chart: {type: view.chart, title: A0, window: 2 s, at: [576, 296]}
edges:
  - uno.device -> pwm.device
  - uno.device -> monitor.device
  - uno.device -> led.device
  - monitor.A0 -> above.in
  - monitor.A0 -> chart.in
  - above.result -> led.value
  - above.result -> shown.in
