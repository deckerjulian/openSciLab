flow: State mode
description: device.capture with 'clock' sends the states at 'states'; 'rate' only stamps their times.
nodes:
  la: {type: device.device, at: [0, 64]}
  capture:
    type: device.capture
    channels: [D0, D1, D2, D3]
    clock: D8
    clock_edge: rising
    samples: 64
    rate: 100 MHz
    trigger: {pattern: '1111', source: D0}
    at: [288, 64]
  bit: {type: convert.bit, bit: D1, at: [576, 88]}
  rising: {type: measure.count, edge: rising, at: [864, 0]}
  check: {type: report.check, expected: 16, title: Rising edges of D1 in 64 states, at: [1152, 0]}
  view: {type: view.scope, title: D1 state by state, at: [864, 168]}
edges:
  - la.device -> capture.device
  - capture.states -> bit.in
  - bit.out -> rising.in
  - bit.out -> view.in
  - rising.out -> check.in
