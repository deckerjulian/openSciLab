flow: CSV logger
description: device.monitor reports A0 and D2 at 10 Hz; data.logger appends them to log.csv.
nodes:
  uno: {type: device.device, at: [0, 128]}
  pwm: {type: gpio.pwm, pin: D9, duty: 0.5, frequency: 1 kHz, at: [272, 248]}
  monitor:
    type: device.monitor
    pins: [D2]
    analog: [A0]
    rate: 10 Hz
    duration: 3 s
    at: [272, 8]
  log: {type: data.logger, path: log.csv, flush: 10, at: [544, 0]}
  chart: {type: view.chart, title: A0, window: 5 s, at: [544, 128]}
edges:
  - uno.device -> pwm.device
  - uno.device -> monitor.device
  - monitor.A0 -> log.in
  - monitor.D2 -> log.in
  - monitor.A0 -> chart.in
