flow: Setup and hold
description: A capture at 50 MHz (20 ns resolution) of the SPI clock and data.
nodes:
  la: {type: device.device, at: [0, 112]}
  capture:
    type: device.capture
    channels: [D10, D11]
    rate: 50 MHz
    samples: 200000
    at: [288, 112]
  timing: {type: measure.setup_hold, edge: rising, at: [576, 184]}
  setup: {type: view.number, title: Setup time, unit: s, at: [864, 208]}
  hold: {type: view.number, title: Hold time, unit: s, at: [864, 376]}
  check: {type: report.check, low: 1.0e-07, unit: s, title: Setup time, at: [864, 0]}
edges:
  - la.device -> capture.device
  - capture.D11 -> timing.data
  - capture.D10 -> timing.clock
  - timing.setup -> setup.in
  - timing.hold -> hold.in
  - timing.setup -> check.in
