flow: Count edges
description: measure.count with 'rising' and with 'both' edges; convert.events makes events of the edges.
nodes:
  la: {type: device.device, at: [0, 16]}
  capture: {type: device.capture, channels: [D15, D9], rate: 1 MHz, duration: 100 ms, at: [288, 16]}
  rising: {type: measure.count, edge: rising, total: false, at: [576, 16]}
  check: {type: report.check, expected: 100, tolerance: 1, title: Rising edges of D15, at: [864, 0]}
  uart_edges: {type: convert.events, kind: both, at: [576, 184]}
  events: {type: measure.count, total: false, at: [864, 208]}
  show: {type: view.number, title: Edges on D9, at: [1152, 208]}
edges:
  - la.device -> capture.device
  - capture.D15 -> rising.in
  - rising.out -> check.in
  - capture.D9 -> uart_edges.in
  - uart_edges.out -> events.in
  - events.out -> show.in
