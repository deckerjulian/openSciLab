flow: Frequency and duty cycle
description: One capture of 10 ms at 20 MHz; the measure nodes work on the single channels.
nodes:
  la: {type: device.device, at: [0, 304]}
  capture:
    type: device.capture
    channels: [D15, D8]
    rate: 20 MHz
    duration: 10 ms
    at: [288, 304]
  frequency: {type: measure.frequency, at: [576, 144]}
  period: {type: measure.period, statistic: mean, at: [576, 248]}
  duty: {type: measure.duty, at: [576, 384]}
  width: {type: measure.pulse_width, level: high, at: [576, 496]}
  clock: {type: measure.frequency, at: [576, 640]}
  frequency_check:
    type: report.check
    expected: 1000
    tolerance: 1
    unit: Hz
    title: D15 frequency
    at: [864, 0]
  duty_check: {type: report.check, low: 0.49, high: 0.51, title: D15 duty cycle, at: [864, 376]}
  clock_check:
    type: report.check
    expected: 1000000
    tolerance: 1000
    unit: Hz
    title: D8 clock
    at: [864, 752]
  show_period: {type: view.number, title: D15 period, unit: s, at: [864, 208]}
  show_width: {type: view.number, title: D15 high time, unit: s, at: [864, 584]}
edges:
  - la.device -> capture.device
  - capture.D15 -> frequency.in
  - capture.D15 -> period.in
  - capture.D15 -> duty.in
  - capture.D15 -> width.in
  - capture.D8 -> clock.in
  - frequency.out -> frequency_check.in
  - duty.out -> duty_check.in
  - clock.out -> clock_check.in
  - period.out -> show_period.in
  - width.out -> show_width.in
