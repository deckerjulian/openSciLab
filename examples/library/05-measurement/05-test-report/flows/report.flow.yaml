flow: Test report
description: report.check nodes test the values; report.write writes all of them when the flow ends - PASSED only when every check passed.
nodes:
  dut: {type: device.device, at: [0, 368]}
  capture:
    type: device.capture
    channels: [D8, D9, D15]
    rate: 10 MHz
    duration: 3 ms
    at: [288, 368]
  intro:
    type: report.section
    title: Device under test
    text: 'The simulated device: clock on D8, UART on D9, 1 kHz on D15.'
    at: [864, 1304]
  clock: {type: measure.frequency, at: [576, 400]}
  clock_check:
    type: report.check
    low: 990000
    high: 1010000
    unit: Hz
    title: Clock D8
    at: [864, 344]
  duty: {type: measure.duty, at: [576, 512]}
  duty_check: {type: report.check, low: 0.45, high: 0.55, title: Duty cycle D8, at: [864, 544]}
  slow: {type: measure.period, at: [576, 624]}
  slow_check:
    type: report.check
    expected: 0.001
    tolerance: 1.0e-05
    unit: s
    title: Period D15
    at: [864, 752]
  uart: {type: decoder.uart, channels: {rx: D9}, baudrate: 115200, format: ascii, at: [576, 216]}
  uart_check: {type: control.compare, value: openSciLab, operator: contains, at: [864, 152]}
  report: {type: report.write, path: test-report.html, title: Test report, at: [864, 0]}
edges:
  - dut.device -> capture.device
  - capture.D8 -> clock.in
  - capture.D8 -> duty.in
  - capture.D15 -> slow.in
  - capture.capture -> uart.in
  - clock.out -> clock_check.in
  - duty.out -> duty_check.in
  - slow.out -> slow_check.in
  - uart.text -> uart_check.a
