flow: Align instruments
description: The Pico's stream of GP15 goes to time.align with the reference's stream of D5; from the first fit on its samples (and what is wired to 'in') are on the reference's time. The device card of the Pico shows the method (sync signal) and the accuracy.
nodes:
  uno: {type: device.device, at: [0, 0]}
  la: {type: device.device, at: [0, 144]}
  pico: {type: device.device, at: [0, 344]}
  sync: {type: time.sync, pin: D7, duration: 1.8 s, at: [288, 0]}
  reference: {type: device.stream, channels: [D5], rate: 100 kHz, duration: 2 s, at: [288, 144]}
  recording: {type: device.stream, channels: [GP15], rate: 100 kHz, duration: 2 s, at: [288, 376]}
  align: {type: time.align, at: [576, 304]}
  offset: {type: view.number, title: Correction, unit: s, at: [864, 224]}
  accuracy: {type: view.number, title: Accuracy, unit: s, at: [864, 600]}
  accuracy_check:
    type: report.check
    high: 0.0002
    unit: s
    last: true
    title: Accuracy
    at: [864, 400]
  aligned: {type: view.scope, title: GP15 on the reference's time, at: [864, 72]}
edges:
  - uno.device -> sync.device
  - la.device -> reference.device
  - pico.device -> recording.device
  - pico.device -> align.device
  - reference.D5 -> align.reference
  - recording.GP15 -> align.signal
  - recording.GP15 -> align.in
  - align.offset -> offset.in
  - align.uncertainty -> accuracy.in
  - align.uncertainty -> accuracy_check.in
  - align.out -> aligned.in
