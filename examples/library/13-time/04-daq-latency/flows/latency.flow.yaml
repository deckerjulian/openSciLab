flow: DAQ latency
description: remote.command runs the command once at the start; the log shows the measured latency and its uncertainty.
nodes:
  daq: {type: device.device, at: [0, 88]}
  calibrate:
    type: remote.command
    command: calibrate_latency
    args: {repeats: 6}
    timeout: 20 s
    at: [272, 0]
  log: {type: view.log, title: Latency of the inputs, at: [544, 0]}
  ai0: {type: remote.input, channel: ai0, duration: 1.5 s, at: [272, 184]}
  chart: {type: view.chart, title: AI0, window: 2 s, at: [544, 184]}
edges:
  - daq.device -> calibrate.device
  - daq.device -> ai0.device
  - calibrate.result -> log.in
  - ai0.out -> chart.in
