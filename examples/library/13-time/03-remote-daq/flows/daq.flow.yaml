flow: Remote DAQ
description: 'The sync line of the DAQ (an input of blocks with sync: true) and the analyzer''s D5 go to remote.align; the analog input ai0 arrives as blocks with the DAQ''s time, converted.'
nodes:
  uno: {type: device.device, at: [0, 0]}
  la: {type: device.device, at: [0, 344]}
  daq: {type: device.device, at: [0, 216]}
  sync: {type: time.sync, pin: D7, duration: 2.3 s, at: [288, 0]}
  reference: {type: device.stream, channels: [D5], rate: 100 kHz, duration: 2.5 s, at: [288, 320]}
  align: {type: remote.align, sync: sync, at: [576, 320]}
  ai0: {type: remote.input, channel: ai0, duration: 2.5 s, at: [288, 184]}
  scatter: {type: view.number, title: Scatter of the sync edges, unit: s, at: [864, 360]}
  scatter_check: {type: report.check, high: 0.0002, unit: s, title: Scatter, at: [864, 152]}
  edges: {type: view.number, title: Matched edges, at: [864, 528]}
  chart: {type: view.chart, title: AI0, window: 3 s, at: [576, 144]}
edges:
  - uno.device -> sync.device
  - la.device -> reference.device
  - daq.device -> align.device
  - daq.device -> ai0.device
  - reference.D5 -> align.signal
  - align.uncertainty -> scatter.in
  - align.uncertainty -> scatter_check.in
  - align.matched -> edges.in
  - ai0.out -> chart.in
