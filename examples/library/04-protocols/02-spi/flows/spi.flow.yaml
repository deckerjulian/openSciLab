flow: SPI
description: 'decoder.spi with clk, mosi and cs; mode 0, 8 bit words, MSB first.'
nodes:
  la: {type: device.device, at: [0, 168]}
  capture:
    type: device.capture
    channels: [D10, D11, D12]
    rate: 16 MHz
    samples: 64000
    at: [288, 168]
  spi:
    type: decoder.spi
    channels: {clk: D10, mosi: D11, cs: D12}
    cpol: 0
    cpha: 0
    wordsize: 8
    at: [576, 72]
  words: {type: view.table, title: SPI words, at: [864, 168]}
  count: {type: measure.count, at: [864, 0]}
  show: {type: view.number, title: Annotations, at: [1152, 0]}
  scope: {type: view.scope, title: SPI, at: [576, 264]}
edges:
  - la.device -> capture.device
  - capture.capture -> spi.in
  - capture.capture -> scope.in
  - spi.table -> words.in
  - spi.events -> count.in
  - count.out -> show.in
